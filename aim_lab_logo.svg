<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880029" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880029" />
      <stop offset="100%" stop-color="#4a0016" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space Dark Circle Frame -->
  <circle cx="250" cy="250" r="230" fill="#0f172a" stroke="#880029" stroke-width="6" />

  <!-- Outer Orbital Rings (Astrodynamics) -->
  <ellipse cx="250" cy="250" rx="200" ry="85" fill="none" stroke="url(#orbitGrad)" stroke-width="4" stroke-dasharray="12 6" transform="rotate(-30 250 250)" />
  <ellipse cx="250" cy="250" rx="190" ry="70" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" transform="rotate(35 250 250)" />

  <!-- AI / Neural Network Nodes Connection Lines -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="2">
    <line x1="170" y1="160" x2="250" y2="250" />
    <line x1="330" y1="170" x2="250" y2="250" />
    <line x1="320" y1="330" x2="250" y2="250" />
    <line x1="180" y1="340" x2="250" y2="250" />
    <line x1="170" y1="160" x2="330" y2="170" />
    <line x1="330" y1="170" x2="320" y2="330" />
  </g>

  <!-- Central Planet/Core Body -->
  <circle cx="250" cy="250" r="65" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="65" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Orbital Trajectory Spacecraft (Rocket/Satellite Motif) -->
  <g transform="translate(375, 155) rotate(25)">
    <polygon points="0,-18 10,12 0,6 -10,12" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="18" r="4" fill="#880029" />
  </g>

  <!-- Neural Network Constellation Nodes -->
  <circle cx="170" cy="160" r="9" fill="#38bdf8" />
  <circle cx="330" cy="170" r="9" fill="#38bdf8" />
  <circle cx="320" cy="330" r="9" fill="#818cf8" />
  <circle cx="180" cy="340" r="9" fill="#38bdf8" />
  <circle cx="250" cy="250" r="11" fill="#ffffff" filter="url(#glow)"/>

  <!-- AIM Typography Emblem -->
  <text x="250" y="440" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">AIM LAB</text>
</svg>